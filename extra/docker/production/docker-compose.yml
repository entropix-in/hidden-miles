name: safarnest-production

services:
    www:
        build:
            context: ../../..
            dockerfile: extra/docker/production/Dockerfile
            target: production
        image: safarnest-web:${IMAGE_TAG:-latest}
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: 3000
            HOSTNAME: 0.0.0.0
            NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://safarnest.in}
            DB_HOST: mysql
            DB_PORT: 3306
            DB_NAME: ${DB_NAME:-safarnest}
            DB_USER: ${DB_USER:-safarnest}
            DB_PASSWORD: ${DB_PASSWORD:-safarnest}
        ports:
            - '${APP_PORT:-3000}:3000'
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
            MYSQL_DATABASE: ${DB_NAME:-safarnest}
            MYSQL_USER: ${DB_USER:-safarnest}
            MYSQL_PASSWORD: ${DB_PASSWORD:-safarnest}
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
        volumes:
            - mysql-data:/var/lib/mysql
            - ../mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
    mysql-data:

name: hidden-miles

services:
    # Next.js application with hot reload
    www:
        image: hidden-miles-local:dev
        build:
            context: ../../..
            dockerfile: extra/docker/production/Dockerfile
            target: development
        command: ["pnpm", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
        env_file:
            - .env
        environment:
            NODE_ENV: development
            DB_HOST: mysql
            DB_PORT: 3306
            DB_NAME: ${DB_NAME:-hiddenmiles}
            DB_USER: ${DB_USER:-hiddenmiles}
            DB_PASSWORD: ${DB_PASSWORD:-hiddenmiles}
            NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
            WATCHPACK_POLLING: "true"
            CHOKIDAR_USEPOLLING: "true"
        ports:
            - '3000:3000'
        volumes:
            - ../../../:/app:rw,delegated
            - hidden-miles-node-modules:/app/node_modules
            - hidden-miles-next:/app/.next
        depends_on:
            mysql:
                condition: service_healthy

    # Content + enquiries database
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
            MYSQL_DATABASE: ${DB_NAME:-hiddenmiles}
            MYSQL_USER: ${DB_USER:-hiddenmiles}
            MYSQL_PASSWORD: ${DB_PASSWORD:-hiddenmiles}
        ports:
            - '3307:3306'
        volumes:
            - hidden-miles-db:/var/lib/mysql
            - ../mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

    # Optional database admin at http://localhost:88
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        profiles:
            - tools
        ports:
            - '88:80'
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: root
            PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
            UPLOAD_LIMIT: 64M
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    hidden-miles-db:
    hidden-miles-node-modules:
    hidden-miles-next:

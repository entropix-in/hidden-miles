name: hidden-miles

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-hiddenmiles}
      MYSQL_USER: ${DB_USER:-hiddenmiles}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hiddenmiles}
    ports:
      - "3307:3306"
    volumes:
      - ${HOME}/.docker/hidden-miles/data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      UPLOAD_LIMIT: 64M
    ports:
      - "88:80"
    depends_on:
      mysql:
        condition: service_healthy

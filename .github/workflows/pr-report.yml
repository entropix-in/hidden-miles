name: PR report (DeepSeek)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect PR diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --no-merges --format='- %h %s (%an)' "$BASE..$HEAD" > pr-commits.txt
          git diff --stat "$BASE...$HEAD" > pr-stat.txt
          git diff --numstat "$BASE...$HEAD" > pr-numstat.txt
          # skip lockfiles/generated noise; cap size so prompt fits the context window
          git diff "$BASE...$HEAD" -- . ':!pnpm-lock.yaml' ':!**/*.min.*' ':!drizzle/meta/**' \
            | head -c 200000 > pr-diff.txt

      - name: Generate report with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: node .github/scripts/pr-report.mjs

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-report
          path: pr-report.html

      - name: Post / update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- deepseek-pr-report -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n${fs.readFileSync('pr-report.md', 'utf8')}\n\n---\n<sub>HTML report: [workflow artifacts](${runUrl}) · generated by DeepSeek</sub>`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
